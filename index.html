  <section class="card">

```
<!-- Box illustration -->
<img
  src="./images/illustration-box-desktop.svg"
  alt="Illustration box"
  class="card-img-box"
>

<!-- Left side -->
<div class="card-left">

  <div class="container-left">

    <img
      src="./images/illustration-woman-online-desktop.svg"
      alt="Woman online"
      class="card-left-img-woman"
    >

    <img
      src="./images/bg-pattern-desktop.svg"
      alt=""
      class="card-left-img-pattern"
    >

  </div>

</div>

<!-- Right side -->
<div class="card-right">

  <h1 class="title">FAQ</h1>

  <!-- FAQs are generated by JavaScript -->
  <div class="faqs"></div>

</div>
